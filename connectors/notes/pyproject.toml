[project]
name = "notes-mcp"
version = "0.1.0"
description = "MCP-коннектор SmartESP: заметки и именованные списки"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp==2.3.0",
]

[project.scripts]
notes-mcp = "notes_mcp:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright==1.1.414",
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "ruff==0.17.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pyright]
include = ["src", "tests"]
