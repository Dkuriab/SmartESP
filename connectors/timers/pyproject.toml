[project]
name = "timers-mcp"
version = "0.1.0"
description = "MCP-коннектор SmartESP: таймеры с именами и напоминания"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mcp==2.3.0",
]

[project.scripts]
timers-mcp = "timers_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["timers_mcp"]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "ruff==0.17.5",
    "pyright==1.1.414",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pyright]
include = ["timers_mcp", "tests"]
strict = ["timers_mcp"]
