[project]
name = "wakeword-trainer"
version = "0.1.0"
description = "Обучение слова пробуждения для колонки SmartESP (microWakeWord)"
requires-python = "==3.12.*"
dependencies = [
    "tensorflow==2.21.0",
    "ai-edge-litert==2.4.0",
    "pymicro-features==2.0.2",
    "audiomentations==0.43.1",
    "mmap-ninja==0.9.0",
    "webrtcvad-wheels==2.0.14.post1",
    "numpy==2.4.4",
    "scipy==1.17.1",
    "pyyaml==6.0.3",
    "httpx==0.28.1",
    "absl-py==2.4.0",
    "tensorboard==2.21.0",
]

[project.scripts]
wakeword = "wakeword_trainer.cli:main"

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wakeword_trainer", "vendor/microwakeword"]

[dependency-groups]
dev = ["pytest==9.0.3", "ruff==0.15.12", "pyright==1.1.409"]

[tool.ruff]
line-length = 110
extend-exclude = ["vendor"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10
