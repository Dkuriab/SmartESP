# Шаблон настроек бота. Скопируйте в settings.toml (он не попадает в git)
# и заполните. Как получить значения — в README.md.

[telegram]
# Токен бота от @BotFather.
bot_token = ""

[core]
# Адрес ядра. Ядро на этом же Mac — оставьте как есть.
url = "http://127.0.0.1:8765"
# Токен ядра: содержимое файла ~/SmartEsp/token.
token = ""

[users]
# Кто может говорить с Кузей: user_id Telegram = "имя человека".
# Остальным бот не отвечает. Пример:
# 123456789 = "Имя"
